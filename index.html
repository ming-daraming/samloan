<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>주거안정지원 대출 안내 및 계산기</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#f4f6f8;--card:#fff;--ink:#17212b;--mut:#5b6773;--line:#d9e0e6;--ac:#0a6c74;--acs:#dff1f2;--ok:#17744a;--oks:#e0f3ea;--no:#b3261e;--nos:#fbe5e3;--wn:#8a5a00;--wns:#fff1d6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mut:#9fb0bd;--line:#2c3a46;--ac:#58c4cc;--acs:#16343a;--ok:#6fd6a0;--oks:#143426;--no:#ff9a92;--nos:#3d1b19;--wn:#f3c46b;--wns:#3a2c10}}
:root[data-theme="dark"]{--bg:#10171d;--card:#18222b;--ink:#e8eef3;--mut:#9fb0bd;--line:#2c3a46;--ac:#58c4cc;--acs:#16343a;--ok:#6fd6a0;--oks:#143426;--no:#ff9a92;--nos:#3d1b19;--wn:#f3c46b;--wns:#3a2c10}
html{scroll-padding-top:60px}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.65 "Noto Sans KR",system-ui,sans-serif}
header{padding:28px 18px 10px;max-width:980px;margin:auto}
h1{margin:0 0 4px;font-size:24px}header p{margin:0;color:var(--mut)}
nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:8px 12px;display:flex;gap:6px;overflow-x:auto}
nav button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);padding:8px 14px;border-radius:20px;font:inherit;cursor:pointer}
nav button[aria-selected=true]{background:var(--ac);color:var(--bg);border-color:var(--ac);font-weight:700}
nav button:focus-visible,summary:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
main{max-width:980px;margin:auto;padding:16px 14px 60px}
section{display:none}section.on{display:block}
h2{font-size:19px;margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:14px 16px;margin:0 0 12px}
.card h3{margin:0 0 6px;font-size:16px;color:var(--ac)}
ul{margin:4px 0;padding-left:20px}li{margin:3px 0}ul ul{list-style:circle}
.tw{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:13.5px;min-width:560px}
th,td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}th{background:var(--acs)}
.note{background:var(--wns);color:var(--wn);padding:8px 12px;border-radius:6px;margin:8px 0}
.tag{display:inline-block;font-size:12px;background:var(--acs);color:var(--ac);border-radius:4px;padding:0 6px;margin-right:6px}
details{background:var(--card);border:1px solid var(--line);border-radius:8px;margin:0 0 8px}
summary{padding:10px 14px;cursor:pointer;font-weight:500}
details>div{padding:0 14px 10px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chips button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:4px 12px;font:inherit;font-size:13px;cursor:pointer}
.chips button.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
input[type=search],input[type=number],input[type=date],select{width:100%;padding:8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
label{display:block;font-size:13px;color:var(--mut)}label span{display:block;margin-bottom:2px}
.ck{display:flex;gap:8px;align-items:center;color:var(--ink);font-size:14px}.ck input{width:auto}
.v{padding:10px 12px;border-radius:6px;margin:4px 0;font-weight:500}
.v.ok{background:var(--oks);color:var(--ok)}.v.no{background:var(--nos);color:var(--no)}.v.wn{background:var(--wns);color:var(--wn)}
.big{font-size:22px;font-weight:700}
.row{display:flex;justify-content:space-between;gap:10px;border-bottom:1px dashed var(--line);padding:4px 0}
.row.min{font-weight:700;color:var(--ac)}
.btn{background:var(--ac);color:var(--bg);border:0;border-radius:6px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<header><h1>주거안정지원 대출 안내</h1><p>자격 · 정책 · 서류 · 절차 · Q&amp;A · 계산기 (정책 문서 기준)</p></header>
<nav id="nav" role="tablist"></nav>
<main id="main"></main>
<script>
const $=id=>document.getElementById(id);
const b=s=>s.replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const L=a=>'<ul>'+a.map(x=>Array.isArray(x)?L(x):'<li>'+b(x)+'</li>').join('')+'</ul>';
const C=(t,a)=>'<div class="card"><h3>'+t+'</h3>'+L(a)+'</div>';
const T=(h,r)=>'<div class="tw"><table><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr>'+r.map(x=>'<tr>'+x.map(y=>'<td>'+b(y)+'</td>').join('')+'</tr>').join('')+'</table></div>';

/* ---------- 0 자격 ---------- */
const S0=C('지원 대상',['신청 및 대출 실행일 시점에 **무주택자**이면서 재직 중인 임직원','본인 및 배우자 모두 주택법상 주택, 분양(입주)권, 오피스텔 미보유자','단, 1주택자가 같은 날 매도 시 무주택자로 간주','임차 시 입주권(조합원), 분양권 보유자는 무주택자로 간주'])
+C('지원 조건 (대상 주택)',['거래금액 **25억 원 이하** 및 국민주택규모 이하인 주택','주택법상 단독주택, 공동주택, 오피스텔(전입신고 가능 시)','거래금액과 기준시세 모두 25억 원 이하','수도권(서울/인천/경기) 및 광역시(구 광역시 포함): 주거전용면적 **85㎡ 이하**','그 외 지역은 면적 제한 없음'])
+'<div class="note">무주택·배우자·공동명의 등 자격 세부 기준은 Q&amp;A 탭의 “자격·대상” 항목을 참고하세요.</div>';

/* ---------- 1 정책 ---------- */
const S1=C('① 매매 (주택 구입)',['**대출 한도:** 임직원 한도 5억 원 / 매매가의 70% / 기준시세의 70% / 잔금 중 **최소값**','**기준 시세:** KB시세 상하한의 산술 평균가, 공동/개별주택 공시가격 130%, 감정평가액 (신축 아파트는 분양가)','**대출 담보:** 1순위 근저당 설정','**근저당 설정 비용:** (직원) 채권 매입비 및 인지세 50% 부담 / (회사) 인지세 50% 및 등록비, 교육세, 수수료 부담','**실거주:** 주택 자금 대출일로부터 1개월 내 전입 및 실거주','**대출 상환:** 3년 거치 10년 상환 (매월 급여 지급 시 원리금 균등 상환)'])
+C('② 전세 (주택 임차)',['**대출 한도:** 보증금의 80% / 생활안정자금 보증보험(최대 3억 원) / 잔금 중 **최소값**','**대출 담보:** SGI서울보증 생활안정자금보증보험 가입','**보증보험료:** 전액 회사 부담 (개인 소득 반영)','**실거주:** 대출 실행 당일 전입 및 실거주','**대출 상환:** 임차 계약 만료 시 일시 상환 (매월 급여 지급 시 이자 상환)'])
+C('③ 공통 조건',['**이자율 연 4.6%:** 개인 부담 **1.5%**, 회사 부담 **3.1%** (소득 반영)','**신청 시기:** 잔금일로부터 3개월 전부터 1개월 전까지 신청 (잔금일은 평일에 한함)'])
+C('최대 한도 정리',['**매매 대출:** 최대 5억 원, 매매가(분양가 포함)의 70%와 기준시세의 70% 중 낮은 금액','**임차 대출:** 보증금의 80%와 생활안정자금보증 한도(최대 3억 원) 중 낮은 금액 (한도가 잔금보다 커도 계약서상 잔금 범위 내에서만 가능)','**DSR:** 적용되지 않음. 다만 향후 금융규제·심사 기준 변경 시 이용금액·상환액이 금융기관 DSR 산정에 반영될 수 있음','**방공제(소액임차보증금 공제):** 매매 대출한도 산정 시 적용되지 않음'])
+C('이자·연체·근저당',['**이자율 조정:** 개인부담 연 1.5%이나 시중 은행 주담대 평균금리가 큰 폭으로 변동 시 예외적으로 조정 검토 가능','**연체이자:** 납부기한(매월 28일) 내 원리금 미납 시 연체 원리금에 연 4.6% 부과, 연체일수는 기한 다음 날부터 실제 납부일까지','**채권최고액:** 대출금의 110% (시중은행 통상 110~130%)','**근저당 말소:** 중도·만기 상환 시 회사가 등기권리증(등기필증) 반환, 회사 위임 법무사 또는 직접 처리, 말소 비용은 본인 부담'])
+C('법무사 지정 및 비용',['소유권 이전 및 근저당권 설정 등기는 모두 회사와 계약된 법무법인을 통해 진행','근저당 설정 법무사 수수료: 회사 부담','소유권 이전 비용: 본인 부담, 임직원 할인(수도권 법무사 표준 보수의 55%, 그 외 70%)'])
+C('즉시 상환 사유',['퇴직(의원면직, 정년퇴직, 징계해고 등)','전입신고·실거주 의무 위반, 대출목적 외 용도로 유용','원리금 누적 3회 이상(연속 3회 포함) 연체','급여·퇴직금 압류, 가압류, 추심 또는 전부명령으로 채권보전이 시급한 경우','파산선고, 개인회생 개시신청, 신용불량 상태 직면','근저당 등 담보 유지 의무 위반 또는 허위 서류 제출','신용상태 현저 악화, 대상 주택 제3자 매매 등 회수 곤란으로 회사가 통지한 경우','매매·임대차 계약의 해제·해지·취소','임직원 또는 배우자가 대상 주택 외 주택을 추가 소유','※ 즉시 상환 대상: 잔여 원리금 및 연체이자. 미이행 시 채권 회수 법적 절차 진행'])
+C('제도 운영 기간',['신청 기준: 대출 실행일(잔금일) 기준 \'35.12.31까지 운영','대환대출은 잔금일 \'26.9.30 이내 건에 한해 \'27.12.31(금)까지 신청']);

/* ---------- 2 서류 ---------- */
const S2='<h2>유형별 필수 제출서류 총괄표</h2>'+T(['구분','매매-무주택','매매-1주택','매매-대환/유주택','임차-무주택/분양','임차-1주택','임차-대환/무주택'],[
['매매/임차 계약서','매매(분양) 계약서','매매(분양) 계약서','매매(분양) 계약서','임대차 계약서','임대차 계약서','임대차 계약서'],
['계좌정보(매도/임대인)','필수','필수','필수','필수','필수','필수'],
['거래신고필증','부동산거래','부동산거래','부동산거래','주택임대차','주택임대차','주택임대차'],
['등기사항전부증명서','신청 주소','신청 주소','신청 주소','임차 주소','임차 주소','임차 주소'],
['부채증명원','선택(대환/분양)','선택(대환/분양)','필수','-','-','필수'],
['분양 납입 증명서','선택(분양 시)','선택(분양 시)','선택(분양 시)','-','-','-'],
['매도 계약서 원본','-','필수(동시 매도)','-','-','필수(동시 매도)','-'],
['중도상환/잔여이자서류','-','-','필수','-','-','필수']])
+C('서류별 필수 여부 및 주의사항 (모두 3개월 이내 발급)',['**가족관계증명서(상세):** 필수. 반드시 (상세)로 발급, 본인/배우자 외 주민번호 마스킹. 심사 시 “열람용”도 인정하나 소유권 이전 등기 시에는 “제출용” 지참','**주민등록등본:** 필수. 주소 및 변경내용 전체공개, 본인/배우자 외 주민번호 마스킹','**청약홈 소유주택현황:** 필수. 무주택자는 신청인 성명과 주민번호 앞자리가 보이도록 화면 캡처 제출','**등기소 부동산 소유현황:** 필수','**청약홈 소유주택현황(배우자) 및 등기소 부동산 소유현황(배우자):** 기혼자 필수. 매매 물건 명의와 무관하게 법률상 배우자 서류 반드시 첨부','**신청 주소 등기사항전부증명서:** 분양계약을 제외한 매매 시 필수 (제출용, 말소사항 포함, 소유담보-특정인 공개: 주민번호 전체 표시)','**부채증명원:** 대환대출자·분양계약자는 대출 잔액 확인을 위해 필수','**중도상환수수료 및 잔여이자 확인 서류:** 대환대출 시 금융기관별로 확인 가능한 서류 첨부'])
+'<h2>단계별 제출 서류</h2>'

['Q41','신청·절차','신청 후 계약 내용이 변경되면?',['대출을 새로 신청해야 합니다.','기존 계약내용으로 대출을 받고 추후 변경 사실이 확인되면 대출금 회수 등의 조치가 있을 수 있습니다.']],
['Q90','신청·절차','대출 실행 후 증액하거나 재대출 받을 수 있나요?',['동일 주택의 매매·임대차계약에 대해 최초 실행 시 확정된 금액을 한 번에 실행하며, 실행 후 증액·재대출은 불가합니다.','임대차계약 갱신으로 보증금이 증가한 경우 증가한 보증금 범위 내 추가 대출 신청은 가능합니다.']],
['Q16','신청·절차','대출 재신청 요건은?',['기존 주거안정대출을 전액 상환하고, 신규 신청 시 무주택자 등 기준을 충족하면 다시 신청할 수 있습니다.']],
['Q43·Q51·Q47','한도·비용','대출 최대 한도, 방공제, DSR은?',['**매매:** 최대 5억 원 한도, 매매가(분양가 포함)의 70%와 기준시세의 70% 중 낮은 금액','**임차:** 보증금의 80%와 생활안정자금보증 한도(최대 3억 원) 중 낮은 금액 (한도가 잔금보다 커도 계약서상 잔금 범위 내)','**방공제:** 매매 대출한도 산정 시 적용되지 않음','**DSR:** 적용되지 않으나, 향후 금융규제·심사 기준 변경 시 금융기관 DSR 산정에 반영될 수 있으므로 급여 수준을 고려해야 함']],
['Q46','한도·비용','전세로 거주 중인 주택을 매수하는 경우 한도는?',['매매계약서상 잔금 범위 내에서 신청 가능합니다.','기존 전세보증금이 회사 임차대출로 조달된 경우 기존 대출을 매매 대출로 승계할 수 있으며, 한도는 (기존 대출 + 전세보증금을 제외한 추가 잔금)과 매매 대출한도 중 낮은 금액입니다.']],
['Q3·Q52·Q59','한도·비용','이자율, 변경 가능성, 연체이자는?',['전체 이자율 4.6% 중 개인 **1.5%**, 회사 **3.1%**(소득 반영)를 부담합니다.','시중 은행권 주담대 평균금리가 큰 폭으로 변동되면 예외적으로 조정을 검토할 수 있습니다.','매월 28일 내 원리금 미납 시 연체 원리금에 연 4.6% 연체이자를 부과하며, 연체일수는 납부기한 다음 날부터 실제 납부일까지 계산합니다.']],
['Q73','한도·비용','근저당 채권최고액은 어떻게 설정되나요?',['대출금의 110%로 설정합니다. (시중은행은 통상 110~130%)']],
['Q75','한도·비용','법무사 지정과 비용은?',['소유권 이전 및 근저당권 설정 등기는 모두 회사 계약 법무법인을 통해 진행합니다.','근저당 설정 법무사 수수료는 회사 부담, 소유권 이전 비용은 본인 부담이며 임직원 할인(수도권 표준 보수의 55%, 그 외 70%)이 적용됩니다.']],
['Q64','지급·실행','매매 및 임차 시 대출금은 어떻게 지급되나요?',['**매매:** 잔금 당일 회사측 법무사가 소유권 이전·근저당 설정등기 서류 확인 후 매도인 계좌로 입금되며 입금자명은 회사명입니다.','**임차:** 잔금일 당일 임대인 계좌로 입금되며 입금자명은 회사명입니다.','매도인·임대인 통장 사본이 필요하며, 회사가 거래대금 일부를 지급한다는 사실을 미리 통보하고 동의를 받아야 합니다. (예: 계약서 특약사항에 명시)','은행 이체 프로세스에 따라 입금시간이 고정되거나 1~2시간 지연될 수 있으므로 잔금 시간을 사전에 조율하세요.']],
['Q31','지급·실행','신규 분양 주택을 임차하는데 등기부상 근저당 확인이 안 됩니다.',['신축 분양 주택은 소유권 이전 등기 후 근저당 설정이 가능하므로, 임대차 계약 특약사항에 근저당 설정을 하지 않는다는 조건이 있으면 가능합니다.']],
['Q91·Q93','지급·실행','임대차 갱신·이사 시 기존 대출은?',['**갱신(Q91):** 계속 이용 가능. 갱신계약서를 제출하고 회사 및 SGI서울보증 재심사를 받아야 합니다.','**이사(Q93):** 기존 대출은 승계 불가. 전액 상환 후 새 임대차계약 기준으로 다시 실행해야 합니다.']],
['Q32·Q33·Q66','분양·재건축','분양주택: 중도금, 잔금(입주), 대출금 지급은?',['**중도금 납부(Q32):** 근저당 설정이 불가하여 신청할 수 없습니다.','**입주 잔금(Q33):** \'26.5.27 이후 분양 계약이고 지원 요건을 충족하면 신청 가능 (이전 계약은 Q17 기준). 대출 실행일에 소유권이전·근저당 설정 불가 시 후취담보제공 약정 체결을 조건으로 실행 가능. 근저당이 안 되는 경우 선순위 채권 담보 의무 제공을 위한 추가 약정을 별도 진행하며, 등기 완료 시점까지 회사 지정 법무사가 분양계약서 원본을 보관합니다.','**절차:** 준공 승인(지자체) → 소유권 보존등기(건설사) → 소유권 취득(임직원) → 1순위 근저당 설정(법무사)','**지급(Q66):** 분양 잔금 당일 법무사가 완납 등 특이사항 확인 후 분양계약서상 은행·계좌로 송금, 입금자명은 수분양자 명의. 중도금 대출 상환은 해당 금융기관 계좌로 송금(입금자명 회사명)하므로 계좌사본이 필요하며, 해당 금융기관에 회사 명의 입금 시 이슈가 없는지 사전 확인해야 합니다.']],
['Q34','분양·재건축','재개발·재건축·리모델링 시에도 신청할 수 있나요?',['대상 보유자는 이주 시점부터 분양권 보유자의 대출 지원 방식을 준용합니다.','제도시행 전 매수자는 ② 이주 후 ~ 입주 전 단계부터 주거안정대출 대상자로 보고, 입주 전까지는 임대차 대출, 입주 시에는 매매 대출을 신청할 수 있습니다.','#T34']],
['Q5·Q68','대환','기존 주택 관련 대출을 사내 대출로 대환할 수 있나요?',['가능합니다. 주택매매 또는 임차 대환 시 **부채증명원**과 **중도상환수수료 및 잔여이자 확인 서류**가 필수입니다.','계약일이 \'26.5.27 이후이며 잔금일이 \'26.9.30까지인 경우 중 외부 금융기관의 주담대 또는 전월세보증금대출을 실행한 건에 한해 신청 가능합니다. (계약일이 \'26.5.27 이전이면 Q17·Q33 적용)','잔금일이 \'26.10.1 이후이면 대환 신청이 불가하며, 외부 대출 없이 처음부터 회사 주거안정대출을 신청해야 합니다.','대환 신청은 \'27.12.31(금)까지 완료해야 합니다.']],
['Q69·Q70','대환','대환 한도와 일부 대환 가능 여부는?',['**한도(Q69):** 기존 금융권 대출액 기준, 대상 대출의 잔액·잔여 이자·중도상환수수료 합산액 이하입니다.','**일부 대환(Q70):** 외부 대출금액보다 적게 대환은 가능하나, 기존 대출은 대환 실행 시점에 전액 상환되어야 하고 외부 금융기관 근저당권도 말소되어야 합니다.','임차(전세) 대환도 기존 대출 전액을 상환하는 조건으로만 가능합니다. (예: 기존 임차대출 4억 원, 회사 한도 3억 원이면 3억 원만 대환하고 1억 원을 남겨두는 것은 불가)']],
['Q65·Q71','대환','대환 시 대출금은 어느 계좌로 입금되나요?',['대환 당일 법무사가 기존 근저당 말소 및 회사 근저당 설정 서류 확인 후 기존 주담대 금융기관 계좌로 송금되며 입금자명은 회사명입니다.','금융기관 입금계좌 사본 제출이 필요하며, 신청자는 해당 금융기관에 회사 명의 입금 시 대환 이슈가 없는지 사전 확인해야 합니다.']],
['Q89','사후관리','실거주하면서 일부를 임대(전대)해도 되나요?',['불가합니다. 실거주 중이라도 주택 일부·전부를 제3자에게 임대하고 보증금 등을 수취하면 목적 외 용도로 대출금을 활용한 것으로 간주합니다.','임대수익 목적의 담보 활용이며, 제3자 임차보증금 반환채권 발생으로 근저당권 담보가치를 저해할 수 있습니다.','적발 시 잔여 원리금 및 연체이자를 즉시 상환해야 하며, 미이행 시 채권 회수 법적 절차가 진행될 수 있습니다.']],
['Q95','사후관리','어떤 경우 즉시 상환해야 하나요?',['퇴직(의원면직, 정년퇴직, 징계해고 등)','전입신고·실거주 의무 위반 또는 대출목적 외 유용','원리금 누적 3회 이상(연속 3회 포함) 연체','급여·퇴직금 압류, 가압류, 추심, 전부명령','파산선고, 개인회생 개시신청, 신용불량 상태','근저당 등 담보 유지 의무 위반 또는 허위 서류 제출','신용 악화·주택 제3자 매매 등으로 회수 곤란하다고 회사가 통지한 경우','매매·임대차 계약 해제·해지·취소','임직원 또는 배우자의 대상 주택 외 주택 추가 소유','※ 잔여 원리금 및 연체이자 즉시 상환, 미이행 시 법적 절차 진행']],
['Q96','사후관리','신청 당시 미혼이었는데 지원 중 결혼하면?',['배우자가 무주택이면 지원이 유지됩니다.','배우자가 혼인 전 보유한 주택이 있으면 **혼인신고일 기준 6개월 이내 매도 계약 체결, 1년 이내 등기 완료**되어야 자격이 유지됩니다.']],
['Q97','사후관리','대출 중 다른 주택을 구매하거나 상속·증여받으면?',['취득·증여 등으로 다주택자(임차는 1주택자)가 되면 회사에 즉시 알려야 하며 대출 지원은 중단됩니다.','알리지 않은 경우 취득일부터 발생한 회사부담 이자(연 3.1%) 상당액을 회수할 수 있고, 이후 제도 이용 시 패널티가 부여될 수 있습니다.','상속의 경우 **상속받은 날로부터 6개월 이내 매도 계약 체결, 1년 이내 등기 완료**되어야 지원자격이 유지됩니다.']],
['Q99','사후관리','퇴직 또는 관계사 이동 시 기존 대출은?',['임직원 자격을 상실하는 경우 **퇴직일부터 17일 이내에 잔여 원리금 전액 상환**해야 합니다.','상환금액에는 대출원금 잔액, 상환일까지 발생한 이자와 그 밖의 미정산 금액이 포함되며, 기한 내 전액 상환하지 않으면 반복 연체 횟수와 관계없이 연체이자를 부과하고 채권 회수 조치에 착수할 수 있습니다.','관계사/자회사 전출 시 전출일로부터 1년간 원리금을 입금하고 1년 내 전액 상환해야 하며, 기한 내 퇴직 예정이면 즉시 상환해야 합니다. (전출사에서 주택대부를 운영 중이면 전출 관계사에서 실행 후 상환 가능)']],
['Q79','사후관리','근저당권 말소는 어떻게 하나요?',['중도 일시상환·만기상환 시 회사가 등기권리증(등기필증)을 반환하며, 회사가 위임한 법무사를 통하거나 직접 처리하면 됩니다. 말소 비용은 본인 부담입니다.']]
];

 if(!rent)A(mk<=250000?'ok':'no','기준시세 '+M(mk*10000)+(mk<=250000?' (25억 이하)':' → 25억 초과'));

 if($('dh').checked){

 +(rent?'<div class="row"><span>실거주</span><span>대출 실행 당일 전입</span></div>':'');

$('go2').onclick=()=>{
 const P=n('ln'),rent=$('ty').value==='rent',od=n('od'),odd=n('odd');
 let html='';
 if(rent){
  const mo=n('mo')||24,pi=P*.015/12,ci=P*.031/12;
  html+='<h4>전세 (만기 일시상환, 월 이자만 납부)</h4><div class="row"><span>월 개인 이자 (1.5%)</span><span>'+M(pi*10000)+'</span></div><div class="row"><span>월 회사 부담 이자 (3.1%)</span><span>'+M(ci*10000)+'</span></div><div class="row"><span>'+mo+'개월 개인 이자 합계</span><span>'+M(pi*mo*10000)+'</span></div><div class="row"><span>'+mo+'개월 회사 부담 합계</span><span>'+M(ci*mo*10000)+'</span></div><div class="row min"><span>만기 일시상환 원금</span><span>'+M(P*10000)+'</span></div>';
